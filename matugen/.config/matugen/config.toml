[config]
version_check = false
reload_apps = false
reload_apps_list = []
set_wallpaper = false

[config.wallpaper]
command = "swww"
arguments = ["img", "--transition-type", "simple"]
set = true

[templates.ignis]
input_path = './templates/colors.scss'
output_path = '~/.config/ignis/colors.scss'

[templates.wlogout]
input_path = './templates/colors.css'
output_path = '~/.config/wlogout/colors.css'

[templates.rofi]
input_path = './templates/rofi-colors.rasi'
output_path = '~/.config/rofi/launchers/themes/matugen.rasi'

[templates.waybar]
input_path = './templates/waybar.css'
output_path = '~/.config/waybar/colors.css'
post_hook = 'toggle-waybar && sleep 2 && toggle-waybar'

[templates.hyprlock]
input_path = './templates/hyprlock.conf'
output_path = '~/.config/hypr/hyprlock/matugen-hyprlock.conf'

[templates.swaync]
input_path = './templates/swaync.css'
output_path = '~/.config/swaync/style.css'
post_hook = 'swaync-client -R -rs; notify-send "Done"'

[templates.hyprland]
input_path = './templates/hyprland-colors2.conf'
output_path = '~/.config/hypr/themes/hyprland-colors.conf'

[templates.kitty]
input_path = './templates/kitty-colors.conf'
output_path = '~/.config/kitty/matugen.conf'

[templates.starship]
input_path = './templates/starship-colors.toml'
output_path = '~/.config/fish/starship.toml'


[templates.ghostty]
input_path = './templates/ghostty'
output_path = '~/.config/ghostty/themes/matugen'
post_hook = 'pkill -SIGUSR2 ghostty'


[templates.pywalfox]
input_path = './templates/pywalfox-colors.json'
output_path = '~/.cache/wal/colors.json'
post_hook = 'pywalfox update'

[templates.obsidian]
input_path = './templates/obsidian.css'
output_path = '~/Nextcloud/Obsidian/MyVault/.obsidian/snippets/obsidian-minimal-matugen-colors.css'

