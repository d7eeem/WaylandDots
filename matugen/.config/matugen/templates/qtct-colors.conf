# Qt5ct/Qt6ct color scheme for Matugen
# Place this in your Matugen templates directory
# Output to: ~/.config/qt5ct/colors/matugen.conf or ~/.config/qt6ct/colors/matugen.conf

[ColorScheme]
# Active window colors (21 values for QPalette roles)
# Format: WindowText, Button, Light, Midlight, Dark, Mid, Text, BrightText, ButtonText, Base, Window, Shadow, Highlight, HighlightedText, Link, LinkVisited, AlternateBase, ToolTipBase, ToolTipText, PlaceholderText, Accent
