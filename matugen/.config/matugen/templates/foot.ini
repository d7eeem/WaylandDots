# Foot terminal theme configuration for Matugen
# Place this in your Matugen templates directory
# Typically: ~/.config/matugen/templates/foot.ini
# -*- conf -*-
# Matugen Material You Theme for Foot
[colors]
background={{colors.surface.default.hex_stripped}}
foreground={{colors.on_surface.default.hex_stripped}}
regular0={{colors.surface_dim.default.hex_stripped}}
regular1={{colors.error.default.hex_stripped}}
regular2={{colors.tertiary.default.hex_stripped}}
regular3={{colors.secondary.default.hex_stripped}}
regular4={{colors.primary.default.hex_stripped}}
regular5={{colors.tertiary_container.default.hex_stripped}}
regular6={{colors.secondary_container.default.hex_stripped}}
regular7={{colors.on_surface_variant.default.hex_stripped}}
bright0={{colors.surface_bright.default.hex_stripped}}
bright1={{colors.error.default.hex_stripped}}
bright2={{colors.tertiary.default.hex_stripped}}
bright3={{colors.secondary.default.hex_stripped}}
bright4={{colors.primary.default.hex_stripped}}
bright5={{colors.tertiary_container.default.hex_stripped}}
bright6={{colors.secondary_container.default.hex_stripped}}
bright7={{colors.on_surface.default.hex_stripped}}
16={{colors.secondary.default.hex_stripped}}
17={{colors.tertiary.default.hex_stripped}}
selection-foreground={{colors.on_primary_container.default.hex_stripped}}
selection-background={{colors.primary_container.default.hex_stripped}}
cursor={{colors.on_primary.default.hex_stripped}} {{colors.primary.default.hex_stripped}}
urls={{colors.primary.default.hex_stripped}}
search-box-no-match={{colors.on_error.default.hex_stripped}} {{colors.error.default.hex_stripped}}
search-box-match={{colors.on_primary_container.default.hex_stripped}} {{colors.primary_container.default.hex_stripped}}
jump-labels={{colors.on_secondary.default.hex_stripped}} {{colors.secondary.default.hex_stripped}}
