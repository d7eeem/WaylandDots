format = '''
 $directory$git_branch$git_status$time$lua$cmd_duration
 $character'''
command_timeout = 1500
palette = 'colors'

[palettes.colors]
color1 = '{{colors.primary.default.hex}}'
color2 = '{{colors.primary_container.default.hex}}'
color3 = '{{colors.on_surface.default.hex}}'
color4 = '{{colors.surface_container.default.hex}}'
color5 = '{{colors.on_primary_container.default.hex}}'
color6 = '{{colors.surface.default.hex}}'
color7 = '{{colors.surface.default.hex}}'
color8 = '{{colors.secondary.default.hex}}'
color9 = '{{colors.tertiary.default.hex}}'

# prompt symbols 
# [character]
# success_symbol = "[➜](color9 bold)"
# error_symbol = "[➜](red)"
# vicmd_symbol = "[<](yellow)"

# [directory]
# format = "[](fg:color1 bg:color4)[ ](bg:color1 fg:color2)[ ](fg:color1 bg:color4)[$path ](fg:color3 bg:color4)[](fg:color4) "

