format = '''
 $directory$git_branch$git_status$time$lua$cmd_duration
 $character'''
command_timeout = 1500
palette = 'colors'

[palettes.colors]
color1 = '#ffb3af'
color2 = '#733331'
color3 = '#f1dedd'
color4 = '#271d1d'
color5 = '#ffdad7'
color6 = '#1a1111'
color7 = '#1a1111'
color8 = '#e7bdba'
color9 = '#e2c28c'

# prompt symbols 
# [character]
# success_symbol = "[➜](color9 bold)"
# error_symbol = "[➜](red)"
# vicmd_symbol = "[<](yellow)"

# [directory]
# format = "[](fg:color1 bg:color4)[ ](bg:color1 fg:color2)[ ](fg:color1 bg:color4)[$path ](fg:color3 bg:color4)[](fg:color4) "

