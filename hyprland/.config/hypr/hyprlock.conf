source = $HOME/.config/hypr/hyprlock/matugen-hyprlock.conf


$font_family = 0xProto Nerd Font Propo
$font_family_clock = 0xProto Nerd Font Propo
$font_material_symbols = Material Symbols Rounded

background {
     path = screenshot
     blur_size = 3
     blur_passes = 5
     noise = 0.0380
     contrast = 1.3000
     brightness = 0.3000
     vibrancy = 0.2100
     vibrancy_darkness = 0.0
 }


label { # Caps Lock Warning
    monitor =
    text = cmd[update:250] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/check-capslock.sh
    color = $primary
    font_size = 13
    font_family = $font_family
    position = 0, -350
    halign = center
    valign = center
}
# INPUT FIELD
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $tertiary
    inner_color = $primary_container
    font_color = $on_primary_container
    fade_on_empty = true
    font_family = $font_family_clock
    hide_input = false
    position = 0, -295
    halign = center
    valign = center
}

# Hour-Time
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%H")"
    color = $on_secondary_container
    font_size = 180
    font_family = $font_family_clock
    position = 0, 300
    halign = center
    valign = center
}

# Minute-Time
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%M")"
    color = $on_secondary_container
    font_size = 180
    font_family = $font_family_clock
    position = 0, 75
    halign = center
    valign = center
}

# Day-Date-Month
label {
    monitor =
    text = cmd[update:1000] echo "$($HOME/.config/hypr/hyprlock/hl_date_color.sh)"
    font_size = 40
    font_family = $font_family
    position = 0, -80
    halign = center
    valign = center
}


label { # User
    monitor =
    text =  $USER
    color = $on_tertiary_container
    shadow_passes = 1
    shadow_boost = 0.35
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    font_size = 20
    font_family = $font_family
    position = 0, -245
    halign = center
    valign = center
}

label { # Status
    monitor =
    text = cmd[update:5000]
    color = $primary
    font_size = 14
    font_family = $font_family

    position = 30, -30
    halign = left
    valign = top
} 

# ========================================
# Weather Icon - Center top
# ========================================
label {
    monitor =
    text = cmd[update:600000] ~/.config/hypr/scripts/weather_hyprlock.sh icon
    color = rgba(255, 255, 255, 1.0)
    font_size = 48
    font_family = $font_family
    position = 0, -60
    halign = center
    valign = top
}

# City Name - Below icon (centered)
label {
    monitor =
    text = cmd[update:600000] ~/.config/hypr/scripts/weather_hyprlock.sh city
    color = $on_tertiary_container
    font_size = 16
    font_family = $font_family
    position = 0, -130
    halign = center
    valign = top
}

# Temperature & Condition - Below city (centered)
label {
    monitor =
    text = cmd[update:600000] ~/.config/hypr/scripts/weather_hyprlock.sh temp-condition
    color = $primary_fixed_dim
    font_size = 13
    font_family = $font_family
    position = 0, -155
    halign = center
    valign = top
}


