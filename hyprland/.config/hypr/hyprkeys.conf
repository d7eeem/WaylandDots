# ── Variables ──
$mainMod = SUPER
$term = kitty -T KiTTY
$file = nautilus -w
$browser = "$HOME/.local/bin/personal/zen.fish"
$lscript = $HOME/.config/hypr/scripts
$walldir = $HOME/Nextcloud/Wallpapers/

# ── Window / Session ──
bind = $mainMod, space, layoutmsg, swapwithmaster master
bind = $mainMod, Q, exec, uwsm app -- $lscript/dontkillsteam.sh
bind = Alt, F4, exec, uwsm app -- $lscript/dontkillsteam.sh
bind = $mainMod, Delete, exec, uwsm stop                                    # CHANGED: uwsm-compatible exit
bind = $mainMod+Alt, F, togglefloating,
bind = $mainMod, G, exec, ~/.local/bin/hyper/hyprlocker.sh
bind = $mainMod, F, fullscreen,
bind = $mainMod+Shift, Q, exec, hyprlock
bind = $mainMod+Shift, F, exec, uwsm app -- $lscript/windowpin.sh
bind = $mainMod, Backspace, exec, uwsm app -- wlogout
bind = Ctrl, Escape, exec, killall waybar || waybar

# ── Applications ──
bind = $mainMod, Return, exec, uwsm app -- $term                            # CHANGED: wrapped with uwsm app
bind = Alt, Return, exec, uwsm app -- foot -e "/usr/bin/bash"               # CHANGED: wrapped with uwsm app
bind = $mainMod+Shift, Return, exec, uwsm app -- $HOME/.local/bin/personal/scratchpad.sh
bind = $mainMod+Shift, apostrophe, exec, uwsm app -- $HOME/.local/bin/personal/calculator.sh
bindr = Ctrl+$mainMod+Alt, R, exec, uwsm app -- $term -e "yazi"             # CHANGED: wrapped with uwsm app
bind = $mainMod, W, exec, uwsm app -- $browser                              # CHANGED: wrapped with uwsm app
bind = Ctrl+Shift, Escape, exec, uwsm app -- $HOME/.local/bin/sysutils/sysmonlaunch.sh                # CHANGED: wrapped with uwsm app
bind = $mainMod, C, exec, uwsm app -- code                                  # CHANGED: wrapped with uwsm app
bind = $mainMod, E, exec, uwsm app -- nautilus --new-window                 # CHANGED: wrapped with uwsm app
bind = $mainMod, I, exec, uwsm app -- gnome-text-editor --new-window        # CHANGED: wrapped with uwsm app
bind = $mainMod+Ctrl+Alt, V, exec, uwsm app -- pavucontrol                  # CHANGED: wrapped with uwsm app

# ── Rofi Menus ──
bind = $mainMod, D, exec, pkill -x rofi || uwsm app -- $HOME/.config/rofi/rofi_launcher.sh drun
bind = $mainMod+Shift, D, exec, pkill -x rofi || uwsm app -- $HOME/.config/rofi/rofi_launcher.sh run
bind = $mainMod+Alt, D, exec, pkill -x rofi || uwsm app -- $HOME/.local/bin/statusbar/sb-droper.fish
bind = $mainMod, Tab, exec, pkill -x rofi || uwsm app -- $HOME/.config/rofi/rofi_launcher.sh window
bind = $mainMod+Shift, E, exec, pkill -x rofi || uwsm app -- $HOME/.config/rofi/rofi_launcher.sh filebrowser

# ── Audio ──
bindl = , XF86AudioMicMute, exec, $lscript/volumecontrol.sh -i m
bindl = , F20, exec, sh -c 'pactl set-source-mute alsa_input.usb-Apple__Inc._USB-C_to_3.5mm_Headphone_Jack_Adapter_DWH441105MRL1MQAX-00.mono-fallback toggle && notify-send "Mic" "$(pactl get-source-mute alsa_input.usb-Apple__Inc._USB-C_to_3.5mm_Headphone_Jack_Adapter_DWH441105MRL1MQAX-00.mono-fallback)"'
bindl = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindl = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindl = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bind = , --release Caps_Lock, exec, swayosd-client --caps-lock

# ── Screenshots & Screencasts ──
bind = , Print, exec, $lscript/hyprshot.sh sm
bind = Ctrl, Print, exec, $lscript/hyprshot.sh sw
bind = Shift, Print, exec, $lscript/hyprshot.sh sa
bind = $mainMod, Print, exec, $lscript/hyprshot.sh vm
bind = $mainMod+Shift, Print, exec, $lscript/hyprshot.sh vr
bind = $mainMod+Alt, Print, exec, $lscript/hyprshot.sh rofi
bind = $mainMod+Shift, O, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mainMod+Ctrl, R, exec, $lscript/hyprshot.sh stop

# ── Clipboard ──
bind = $mainMod, V, exec, uwsm app -- $HOME/.local/bin/rofi/cliphist.sh -c
bind = $mainMod+Shift, V, exec, uwsm app -- $HOME/.local/bin/rofi/cliphist.sh -d
bind = $mainMod+Ctrl, V, exec, uwsm app -- $HOME/.local/bin/rofi/cliphist.sh -w

# ── Custom Scripts ──
bind = $mainMod, T, exec, uwsm app -- $lscript/layoutchanger.sh
bind = $mainMod+Shift, T, exec, uwsm app -- $HOME/.local/bin/personal/c2s.sh
bind = $mainMod+Shift, A, exec, pkill -x rofi || uwsm app -- $HOME/.local/bin/sysutils/rofiselect.sh
bind = $mainMod+Shift, W, exec, uwsm app -- $HOME/.local/bin/personal/setwall.sh &
bind = $mainMod, P, exec, /usr/bin/hyprpicker | wl-copy
bind = $mainMod+Alt, W, exec, pkill $HOME/.local/bin/personal/hypr-wall.sh ~/Nextcloud/Wallpapers/ || uwsm app -- $HOME/.local/bin/personal/hypr-wall.sh ~/Nextcloud/Wallpapers/
bind = Shift+Alt, ALT_L, exec, uwsm app -- $lscript/keyboardswitch.sh
bind = Shift+Alt, ALT_R, exec, uwsm app -- $lscript/keyboardswitch.sh
bind = Ctrl+Shift+Alt, Delete, exec, pkill wlogout || uwsm app -- wlogout -p layer-shell

# ── Focus ──
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = Alt, Tab, movefocus, d
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Right, movefocus, r
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Down, movefocus, d

# ── Workspaces ──
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# ── Resize ──
binde = $mainMod+Shift, L, resizeactive, 30 0
binde = $mainMod+Shift, H, resizeactive, -30 0
binde = $mainMod+Shift, K, resizeactive, 0 -30
binde = $mainMod+Shift, J, resizeactive, 0 30

# ── Move to Workspace ──
bind = $mainMod+Ctrl+Alt, Right, movetoworkspace, r+1
bind = $mainMod+Ctrl+Alt, Left, movetoworkspace, r-1
bind = $mainMod+Shift, 1, movetoworkspacesilent, 1
bind = $mainMod+Shift, 2, movetoworkspacesilent, 2
bind = $mainMod+Shift, 3, movetoworkspacesilent, 3
bind = $mainMod+Shift, 4, movetoworkspacesilent, 4
bind = $mainMod+Shift, 5, movetoworkspacesilent, 5
bind = $mainMod+Shift, 6, movetoworkspacesilent, 6
bind = $mainMod+Shift, 7, movetoworkspacesilent, 7
bind = $mainMod+Shift, 8, movetoworkspacesilent, 8
bind = $mainMod+Shift, 9, movetoworkspacesilent, 9
bind = $mainMod+Shift, 0, movetoworkspacesilent, 10
bind = Ctrl+$mainMod+Shift, Up, movetoworkspacesilent, special
bind = $mainMod+Alt, S, movetoworkspacesilent, special

# ── Move Windows ──
bind = $mainMod+Shift+Ctrl, L, movewindow, l
bind = $mainMod+Shift+Ctrl, H, movewindow, r
bind = $mainMod+Shift+Ctrl, K, movewindow, u
bind = $mainMod+Shift+Ctrl, J, movewindow, d

# ── Scroll Workspaces ──
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# ── Mouse Move/Resize ──
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindm = $mainMod, Z, movewindow
bindm = $mainMod, X, resizewindow

# ── System Settings ──
bind = $mainMod+Shift, X, exec, uwsm app -- sh -c 'XDG_CURRENT_DESKTOP="gnome" gnome-control-center'  # CHANGED

# ── Layout ──
bind = $mainMod, T, exec, $HOME/.config/hypr/scripts/changeLayout.sh

# ── Reloading ──
bind = $mainMod+Shift, R, exec, hyprctl reload && notify-send "HYPRCTL" "Hyprland reloaded" --icon $HOME/.config/fastfetch/pngs/arch.png && sleep 0.2 && bash $HOME/.config/hypr/scripts/refresh.sh
bind = Ctrl+Shift, Escape, exec, uwsm app -- gnome-system-monitor          # CHANGED
bind = $mainMod+Ctrl, Escape, exec, uwsm app -- missioncenter              # CHANGED
