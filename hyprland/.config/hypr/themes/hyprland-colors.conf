$THEME_COLOR = f0dfd7
$CURSOR_COLOR = 422b1b

general {
    col.active_border = rgba(ffb786ff) rgba(140d08ff) 45deg
    col.inactive_border = rgba(5b4130ff)
}



decoration {
    rounding = 14
    shadow:enabled = false

    blur {
        enabled = yes
        size = 6
        passes = 3
        new_optimizations = on
        ignore_opacity = on
        xray = false
    }
}

layerrule = blur,waybar
