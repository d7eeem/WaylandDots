$THEME_COLOR = f1dedd
$CURSOR_COLOR = 442927

general {
    col.active_border = rgba(ffb3adff) rgba(140c0bff) 45deg
    col.inactive_border = rgba(5d3f3dff)
}



decoration {
    rounding = 14
    shadow:enabled = false

    blur {
        enabled = yes
        size = 6
        passes = 3
        new_optimizations = on
        ignore_opacity = on
        xray = false
    }
}

layerrule = blur,waybar
