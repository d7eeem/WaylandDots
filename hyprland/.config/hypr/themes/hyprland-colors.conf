$THEME_COLOR = e0e3e8
$CURSOR_COLOR = 22323f

general {
    col.active_border = rgba(96cdf8ff) rgba(0b0f12ff) 45deg
    col.inactive_border = rgba(384956ff)
}



decoration {
    rounding = 14
    shadow:enabled = false

    blur {
        enabled = yes
        size = 6
        passes = 3
        new_optimizations = on
        ignore_opacity = on
        xray = false
    }
}

layerrule = blur,waybar
