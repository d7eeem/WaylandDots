$THEME_COLOR = e2e2e9
$CURSOR_COLOR = 283041

general {
    col.active_border = rgba(abc7ffff) rgba(0c0e13ff) 45deg
    col.inactive_border = rgba(3e4759ff)
}



decoration {
    rounding = 14
    shadow:enabled = false

    blur {
        enabled = yes
        size = 6
        passes = 3
        new_optimizations = on
        ignore_opacity = on
        xray = false
    }
}

layerrule = blur,waybar
