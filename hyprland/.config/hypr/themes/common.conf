# ▄▀▀ █ █ █▀▄ ▄▀▀ ▄▀▄ █▀▄
# ▀▄▄ ▀▄█ █▀▄ ▄█▀ ▀▄▀ █▀▄
exec = hyprctl setcursor Bibata-Modern-Ice 20
exec = gsettings set org.gnome.desktop.interface cursor-theme 'Bibata-Modern-Ice'
exec = gsettings set org.gnome.desktop.interface cursor-size 20

# ▄▀▀ ▄▀▄ █▄ █ ▀█▀
# █▀  ▀▄▀ █ ▀█  █
exec = gsettings set org.gnome.desktop.interface font-name '0xProto Nerd Font Propo 10'
exec = gsettings set org.gnome.desktop.interface document-font-name '0xProto Nerd Font Propo 10'
exec = gsettings set org.gnome.desktop.interface monospace-font-name '0xProto Nerd Font Propo 9'
exec = gsettings set org.gnome.desktop.interface font-antialiasing 'rgba'
exec = gsettings set org.gnome.desktop.interface font-hinting 'full'

# █▀▄ ██▀ ▄▀▀ ▄▀▄ █▀▄ ▄▀▄ ▀█▀ █ ▄▀▄ █▄ █
# █▄▀ █▄▄ ▀▄▄ ▀▄▀ █▀▄ ▀▄▀  █  █ ▀▄▀ █ ▀█
decoration {
    rounding = 4
    dim_special = 0.1
    shadow:enabled = true
    blur {
        enabled = yes
        size = 6
        passes = 3
        new_optimizations = on
        ignore_opacity = on
        xray = false
        special = true
    }
}
