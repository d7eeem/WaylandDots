
# Environment
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment --all

# GTK / theme (pick ONE method)
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'Tahoe-Dark'
# OR rely on flatpak_themer.sh (then remove gsettings line)

# XDG portals
exec-once = $lscript/resetxdgportal.sh

# Clipboard
exec-once = uwsm app -a cliphist-text -- wl-paste --type text --watch cliphist store
exec-once = uwsm app -a cliphist-image -- wl-paste --type image --watch cliphist store

# Services
exec-once = uwsm app -a swww-daemon -- swww-daemon
exec-once = uwsm app -a swayosd-server -- swayosd-server
exec-once = uwsm app -a sway-audio-idle-inhibit -- sway-audio-idle-inhibit

# Applets
exec-once = uwsm app -a blueman-applet -- blueman-applet
exec-once = uwsm app -a nm-applet -- nm-applet --indicator
exec-once = uwsm app -a udiskie -- udiskie --no-automount --smart-tray

# Auth
exec-once = uwsm app -a gnome-keyring -- gnome-keyring-daemon --start --components=secrets,ssh
exec-once = uwsm app -a hyprpolkitagent -- /usr/lib/hyprpolkitagent/hyprpolkitagent

# Programs
exec-once = uwsm app -a gsconnect -- gapplication launch org.gnome.Shell.Extensions.GSConnect
exec-once = uwsm app -a syncthingy -- sh -c 'sleep 5 && flatpak run com.github.zocker_160.SyncThingy'
exec-once = uwsm app -a flatpak-themer -- $HOME/.local/bin/personal/flatpak_themer.sh
exec-once = uwsm app -a nextcloud -- flatpak run com.nextcloud.desktopclient.nextcloud
exec-once = uwsm app -a trash-empty -- trash-empty 30

# Cursor
exec-once = hyprctl setcursor Bibata-Modern-Ice 20

# Final portal restart
exec-once = systemctl --user restart xdg-desktop-portal

