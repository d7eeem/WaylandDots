# ----------------------------
# XDPH (Keep these - they're system initialization)
# ----------------------------
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /home/tinker/WaylandDots/personal_scripts/.local/bin/hyde/resetxdgportal.sh
exec-once = dbus-update-activation-environment --systemd --all

# ----------------------------
# Clipboard Manager
# ----------------------------
exec-once = uwsm app -a -- wl-paste --type text --watch cliphist store
exec-once = uwsm app -a -- wl-paste --type image --watch cliphist store

# ----------------------------
# System Services (use systemd units if available)
# ----------------------------
# Check if these have systemd units: systemctl --user list-unit-files | grep -E 'waybar|swaync|hypridle'
# If they do, enable them instead: systemctl --user enable waybar.service
exec-once = uwsm app -a -- waybar
exec-once = uwsm app -a -- swaync
exec-once = uwsm app -a -- swww-daemon
exec-once = uwsm app -a -- swayosd-server
exec-once = uwsm app -a -- sway-audio-idle-inhibit

# ----------------------------
# Applets
# ----------------------------
exec-once = uwsm app -a -- blueman-applet
exec-once = uwsm app -a -- nm-applet --indicator
exec-once = uwsm app -a -- udiskie --no-automount --smart-tray

# ----------------------------
# Authentication Agents
# ----------------------------
exec-once = uwsm app -a -- gnome-keyring-daemon
exec-once = uwsm app -a -- /usr/lib/hyprpolkitagent/hyprpolkitagent

# ----------------------------
# Programs
# ----------------------------
exec-once = uwsm app -a -- gapplication launch org.gnome.Shell.Extensions.GSConnect
exec-once = uwsm app -a -- sh -c 'sleep 5 && flatpak run com.github.zocker_160.SyncThingy'
exec-once = uwsm app -a -- /home/tinker/.local/bin/personal/flatpak_themer.sh
exec-once = uwsm app -a -- flatpak run com.nextcloud.desktopclient.nextcloud
exec-once = uwsm app -a -- trash-empty 30
exec-once = uwsm app -a -- xsettingsd

# ----------------------------
# UX Tools
# ----------------------------
exec-once = hyprctl setcursor Bibata-Modern-Ice 20
exec-once = systemctl --user import-environment QT_QPA_PLATFORMTHEME
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'WhiteSur-Dark'
